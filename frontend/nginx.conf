# Production edge for AniChopar.
#
# Three names, one container, one Django upstream — and TLS terminated right
# here with the Let's Encrypt certificate certbot issued on the host, served
# from ./certs (mounted read-only, see docker-compose.yml):
#
#   anichopar.uz (also www/bot/admin)  the SPA, /static, /media, /django-admin
#   admin.anichopar.uz                the panel SPA served as the document
#   api.anichopar.uz                  the REST API (/api/... and schema)
#
# Every origin listens on 80 *and* 443 and answers identically on both. Port 80
# deliberately does not redirect: Cloudflare's Flexible mode keeps talking plain
# http to the origin even for an https visitor, so a redirect there sends the
# browser straight back to the same url and the request loops forever. With both
# ports open the edge may choose either — Flexible hits 80, Full hits 443 and
# gets this certificate — and a never-proxied visitor gets real TLS.
#
# anichopar.uz/api and anichopar.uz/admin are refused outright: the browser
# calls //api.anichopar.uz/api (VITE_API_BASE_URL) and the panel is reached at
# admin.anichopar.uz/ directly, so the old same-origin prefixes would only be a
# second way in. The two browser origins differ now, which CORS joins
# (CORS_ALLOWED_ORIGINS in .env).
#
# Division of labour for media:
#   /media/covers/            posters written by movies/covers.py
#   /media/manga/pages/       rendered chapter pages written by movies/pdf_pages.py
#   /media/static/...         collectstatic output
# are read from the volume here; Django only ever *reports* where a file is and
# never streams an image byte in production. Everything below /media/manga/
# except /media/manga/pages/ (the source PDF and the render workspace) is
# refused, so there is still no file a visitor can download.

# --- Abuse controls ---------------------------------------------------------
# Cloudflare's orange-cloud proxy terminates the visitor connection at the edge,
# so without the map below every request would arrive from one of a handful of
# edge IPs and the whole site would share a single rate budget. CF-Connecting-IP
# carries the real client and is overwritten by Cloudflare on every proxied
# request; a direct hit (origin IP, grey-cloud record) has no such header and
# falls back to the peer address.
map $http_cf_connecting_ip $anichopar_client {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# The visitor's scheme, likewise: with Cloudflare in front (Flexible or Full)
# X-Forwarded-Proto arrives from the proxy, only a never-proxied request has
# none. Django trusts it through SECURE_PROXY_SSL_HEADER, so this decides
# whether the app answers as http or https.
map $http_x_forwarded_proto $anichopar_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Per-client request rates. The auth zone is deliberately tight: it only covers
# login/register/refresh/telegram-login, so credential stuffing and refresh
# token brute force hit a wall while a signed-in user browsing the catalogue
# stays on the generous API zone.
limit_req_zone $anichopar_client zone=anichopar_auth:10m rate=5r/m;
limit_req_zone $anichopar_client zone=anichopar_api:10m rate=25r/s;
# Concurrent connections per client: one host cannot pin every gunicorn worker.
limit_conn_zone $anichopar_client zone=anichopar_conn:10m;

# Known scanners are refused at the edge, before any header reaches Django.
map $http_user_agent $anichopar_bad_agent {
    default 0;
    ~*(sqlmap|nikto|nmap|masscan|zgrab|dirbuster|gobuster|feroxbuster|wpscan|acunetix|nessus|havij|arachni|netcraft) 1;
}

# The same client/scheme the rate limits and Django see, so a 403/429 in the
# log names the actual visitor instead of a Cloudflare edge IP.
log_format anichopar '$anichopar_client - $host [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" proto=$anichopar_proto';

# The Django upstream is *not* declared as an `upstream` block on purpose.
# nginx resolves a static upstream exactly once, at config load, and keeps that
# IP for the lifetime of the process — but `docker compose up -d --build`
# recreates the web container (and gives it a new address on 172.18.0.x) while
# leaving an already-running nginx alone. Every proxied request then hits the
# dead address and answers 502, and because that error page carries no
# Access-Control-Allow-Origin header the browser reports it as a CORS failure
# on /api/auth/token/ — the login form looks broken for a reason that has
# nothing to do with CORS. Instead each proxy location passes a variable, which
# nginx resolves through Docker's embedded DNS per request (see `resolver`
# below), so a recreated backend is picked up within seconds.
#
#   resolver 127.0.0.11 valid=10s ipv6=off;   Docker's DNS
#   set $anichopar_backend http://web:8000;  re-resolved, not frozen
#
# (No keepalive pool to the upstream: an OSS nginx only pools connections for a
# named `upstream`, which is exactly the thing that goes stale. Gunicorn opens
# a fresh connection per request instead — the normal setup for this stack.)

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # One certificate covers all five names (anichopar.uz, www, admin, bot,
    # api) — certbot issued it for exactly this set. The files live under
    # ./certs on the host: /etc/letsencrypt cannot be bind-mounted here (the
    # snap-packaged docker daemon resolves it to an empty directory), so root
    # copies them into the project directory. The renewal deploy hook makes
    # that copy again after every renew and reloads this container, and
    # options-ssl-nginx.conf keeps the protocol/cipher floor in sync with
    # certbot's own recommendation in the meantime.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    include             /etc/nginx/certs/options-ssl-nginx.conf;
    ssl_dhparam         /etc/nginx/certs/ssl-dhparams.pem;

    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log anichopar;

    # Manga PDFs are uploaded through the API (see DATA_UPLOAD_MAX_MEMORY_SIZE).
    client_max_body_size 512m;
    server_tokens off;

    # Edge limits: a flood is dropped with 429 instead of queueing in gunicorn.
    limit_conn anichopar_conn 64;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header X-Permitted-Cross-Domain-Policies none always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    # Edge refusals (an `if` with `return` is safe in server context: it only
    # short-circuits the request).
    # 1. Exploit scanners and CMS/PHP probe targets: close the connection
    #    without a body, so a probe learns nothing at all.
    location ~* ^/(?:wp-admin|wp-login|xmlrpc\.php|phpmyadmin|pma|vendor/phpunit|cgi-bin|actuator|\.env|\.git) {
        return 444;
    }
    # 2. Hidden files (.htaccess, backups, editor swaps) are never published.
    #    /.well-known stays reachable for ACME/verification challenges.
    location ~ /\.(?!well-known) {
        deny all;
    }
    # 3. Only the verbs the API and the SPA use.
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }
    # 4. Scanner user agents (health checks use wget/curl and are exempt).
    if ($anichopar_bad_agent) {
        return 403;
    }

    # The administrator panel and the API are separate origins now
    # (admin.anichopar.uz, api.anichopar.uz). These prefixes on the public site
    # are refused outright: no old bundle, guessed URL or forgotten bookmark
    # reaches them here, and the panel route in App.jsx only exists for the
    # dev server, which has no nginx in front.
    location ^~ /admin {
        return 404;
    }
    location ^~ /api {
        return 404;
    }

    # Re-resolve `web` per request (see the note above the server blocks).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $anichopar_backend http://web:8000;

    # Shared by every proxied location below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $anichopar_client;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $anichopar_proto;
    proxy_set_header X-Forwarded-Host $host;
    # No hop-by-hop headers towards the upstream: connections stay HTTP/1.1.
    proxy_set_header Connection "";
    proxy_redirect off;
    proxy_read_timeout 120s;

    # ACME http-01 token: certbot on the host (webroot mode) writes it into
    # ./certbot-www, which is mounted read-only at /var/www/certbot. `^~` is
    # what makes this work — it outranks the hidden-file regex above even when
    # the token itself contains a dot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        access_log off;
    }

    # Liveness probe used by the compose healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints every file in /assets, so they can be cached forever.
    # (A location with its own add_header drops the inherited ones, hence the
    # repeated nosniff.)
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The shell must never be cached, otherwise users keep an old bundle.
    # Every SPA route ends up here through try_files' internal redirect, so
    # this location — not `location /` — is what really serves the document.
    # A location-level add_header replaces the inherited ones, hence the
    # repeated headers plus the content policy that stops injected markup
    # from running. `img-src data:` only exists for a stale bundle written
    # while covers were still base64.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
        add_header X-Permitted-Cross-Domain-Policies none always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org https://*.telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.telegram.org; font-src 'self' data:; connect-src 'self' http://api.anichopar.uz https://api.anichopar.uz https://*.telegram.org wss://*.telegram.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self'; frame-ancestors 'self'; worker-src 'self' blob:" always;
    }

    location ~* ^/(favicon\.(ico|png)|apple-touch-icon\.png)$ {
        access_log off;
        expires 30d;
    }

    # collectstatic output, written by the web container into a shared volume.
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
    }

    # --- Credential endpoints: 5 req/min per client --------------------------
    # (on api.anichopar.uz — see the server block below. anichopar.uz/api is
    # refused at the top of this server, so no proxied API location remains
    # here.)

    # Posters (movies/covers.py): uploaded once, then every hit is a cache hit.
    # A replaced cover gets a new filename, so no stale image can survive.
    location /media/covers/ {
        alias /var/www/media/covers/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cross-Origin-Resource-Policy same-origin always;
    }

    # Rendered chapter pages (movies/pdf_pages.py). The URL carries ?v=<digest>,
    # so the browser re-fetches only after a PDF is re-rendered; `^~` keeps the
    # catch-all refusal below from matching.
    location ^~ /media/manga/pages/ {
        alias /var/www/media/manga/pages/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cross-Origin-Resource-Policy same-origin always;
    }

    # Uploaded chapter PDFs and the render workspace live under /media/manga/
    # and must never be reachable directly: readers get page images from the
    # location above and the raw PDF is refused by the API too, so there is no
    # file a visitor can download.
    location ~* ^/media/manga/ {
        return 404;
    }

    # Uploaded screenshots and other media, plus the SPA's media routes:
    # /media/:slug is a client-side route (the bot links to it), so a path that
    # names no file falls through to the app shell instead of a hard 404.
    # `root /var/www` maps /media/... → /var/www/media/..., which is where the
    # volume sits; a missing *image* still ends up here, but the browser renders
    # it as a broken image exactly as it did a 404.
    location /media/ {
        root /var/www;
        access_log off;
        expires 7d;
        try_files $uri $uri/ /index.html;
    }

    # Django's built-in admin. It must NOT live under /admin/ here: that prefix
    # belongs to the React administrator panel, which is a client-side route of
    # the SPA below. Proxying /admin/ to Django made every panel URL
    # (/admin/game-ratings, /admin/quiz, ...) answer with Django's login page, so
    # deep links and refreshes were impossible. Keep this in sync with
    # path('django-admin/', ...) in kino_top/kino_top/urls.py.
    # No trailing slash on purpose: this prefix also matches a bare
    # /django-admin, which Django redirects to /django-admin/ itself.
    location /django-admin {
        proxy_pass $anichopar_backend;
    }

    # SPA routes (/, /profile, /media/:slug, ...) fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# API origin
# ---------------------------------------------------------------------------
# api.anichopar.uz is the only place /api/ answers: the SPA builds its calls
# from VITE_API_BASE_URL (//api.anichopar.uz/api) and the browser resolves the
# scheme-relative URL against the page, so http and https both follow the
# visitor. Same abuse controls, same upstream — only the prefix differs.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.anichopar.uz;

    # Same certificate as the main origin: api.anichopar.uz is one of its
    # SANs, so the same ./certs files terminate TLS here.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    include             /etc/nginx/certs/options-ssl-nginx.conf;
    ssl_dhparam         /etc/nginx/certs/ssl-dhparams.pem;

    server_tokens off;
    access_log /var/log/nginx/access.log anichopar;
    # PDF uploads ride this origin too (see DATA_UPLOAD_MAX_MEMORY_SIZE).
    client_max_body_size 512m;

    limit_conn anichopar_conn 64;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Permitted-Cross-Domain-Policies none always;

    # The same edge refusals as on the main origin.
    location ~* ^/(?:wp-admin|wp-login|xmlrpc\.php|phpmyadmin|pma|vendor/phpunit|cgi-bin|actuator|\.env|\.git) {
        return 444;
    }
    location ~ /\.(?!well-known) {
        deny all;
    }
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }
    if ($anichopar_bad_agent) {
        return 403;
    }

    # Same per-request re-resolution of `web` as on the main origin.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $anichopar_backend http://web:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $anichopar_client;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $anichopar_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_redirect off;
    proxy_read_timeout 120s;
    proxy_send_timeout 300s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # http-01 challenge for this host too: renewal validates every SAN, and
    # api.anichopar.uz answers from this block, not the main one.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        access_log off;
    }

    # A bare visit lands on the schema instead of a missing SPA shell: there is
    # no index.html on this origin.
    location = / {
        return 302 /api/schema/;
    }

    # --- Credential endpoints: 5 req/min per client --------------------------
    # Covers /api/auth/token/ (login + refresh), /api/auth/register/ and the
    # Telegram sign-in routes. Real users send two or three requests here in a
    # burst; a credential stuffing run cannot.
    location ~ ^/api/auth/(token|register|telegram) {
        limit_req zone=anichopar_auth burst=10 nodelay;
        limit_req zone=anichopar_api burst=100 nodelay;
        proxy_pass $anichopar_backend;
    }

    # Django REST API and the schema/docs.
    location /api/ {
        limit_req zone=anichopar_api burst=100 nodelay;
        proxy_pass $anichopar_backend;
    }

    # Nothing else lives on this origin: no SPA, no media, no django admin.
    location / {
        return 404;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
# TLS terminates in this container with the Let's Encrypt certificate certbot
# issued on the host for all five names (the ssl_* lines at the top of both
# server blocks). Cloudflare stays in front and only decides which listener it
# talks to: Flexible keeps sending plain http to :80, Full sends https to :443
# where the certificate is already presented — both answer with the same site,
# and the $anichopar_proto map turns either into an https scheme for Django
# (X-Forwarded-Proto from the edge, $scheme on a direct 443 hit).
#
# What is deliberately *not* here:
#
# - a port 80 → 443 redirect: Flexible would hand that Location header straight
#   back to the browser, which asks for https, gets proxied to :80 again and
#   loops forever — the failure this box had before TLS moved into the
#   container;
# - Strict-Transport-Security: Cloudflare owns the visitor's scheme and can add
#   it from the dashboard, while an origin-side HSTS is nearly impossible to
#   take back. Only if the edge is ever removed, add
#   `add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"
#   always;` to the ssl server blocks (plus DJANGO_SECURE_HSTS_SECONDS in .env
#   for Django's own responses) — and mind the locations that already define an
#   add_header, they drop inherited ones.
#
# Renewal: certbot runs on the host in webroot mode, drops the http-01 token
# into ./certbot-www (mounted read-only at /var/www/certbot), copies the renewed
# certificate into ./certs and reloads this container's nginx through a deploy
# hook. Host nginx must not own ports 80/443 for any of that to work — see
# DEPLOY.md.
