# Production edge for AniChopar.
#
# nginx serves the built SPA, forwards the Django routes to the `web` container
# and serves the static/media files straight from the shared volumes. Because
# everything is one origin, the website needs no CORS setup and the Django admin
# keeps working through the proxy.

upstream anichopar_backend {
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Manga PDFs are uploaded through the API (see DATA_UPLOAD_MAX_MEMORY_SIZE).
    client_max_body_size 512m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Shared by every proxied location below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_redirect off;
    proxy_read_timeout 120s;

    # Liveness probe used by the compose healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints every file in /assets, so they can be cached forever.
    # (A location with its own add_header drops the inherited ones, hence the
    # repeated nosniff.)
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The shell must never be cached, otherwise users keep an old bundle.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location ~* ^/(favicon\.(ico|png)|apple-touch-icon\.png)$ {
        access_log off;
        expires 30d;
    }

    # collectstatic output, written by the web container into a shared volume.
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
    }

    # Uploaded manga PDFs and generated files.
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
    }

    # Django REST API, schema/docs and the administrator panel.
    location /api/ {
        proxy_pass http://anichopar_backend;
    }

    location /admin/ {
        proxy_pass http://anichopar_backend;
    }

    # SPA routes (/, /profile, /media/:slug, ...) fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
# TLS can be terminated by an upstream proxy, or here: mount the certificate
# into the container and add a second, otherwise identical server block that
# listens on 443 ssl with
#
#   ssl_certificate     /etc/nginx/certs/fullchain.pem;
#   ssl_certificate_key /etc/nginx/certs/privkey.pem;
#
# plus a `return 301 https://$host$request_uri;` on port 80. Either way nginx
# sends X-Forwarded-Proto, which Django reads through SECURE_PROXY_SSL_HEADER,
# so absolute redirects and CSRF checks stay on https.
