server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/game;
    index index.html;

    server_tokens off;
    client_max_body_size 50m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/wasm
        model/gltf+json
        model/gltf-binary
        text/css
        text/plain
        image/svg+xml;

    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(glb|gltf|bin)$ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Access-Control-Allow-Origin * always;
        try_files $uri =404;
    }

    location ~* \.(mp3|ogg|wav|png|jpg|jpeg|webp|svg|ico)$ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
